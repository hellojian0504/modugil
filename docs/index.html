<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>모두길 MODUGIL</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="./static/style.css?v=6" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div><h1>모두길</h1><p>경사 기반 이동성 경로 실험</p></div>
      </div>

      <section class="card">
        <div class="step-row"><span class="step-number">1</span><div><strong>출발점과 도착점을 지도에서 클릭</strong><p id="click-guide">먼저 출발점을 클릭해 주세요.</p></div></div>
        <div class="search-panel">

          <div class="search-row">
            <span class="search-icon">🟢</span>

            <input
              id="start-search"
              class="place-search"
              type="text"
              placeholder="출발지를 검색하세요"
            />

            <button
              id="start-search-btn"
              class="search-btn"
              type="button"
            >
              🔍
            </button>
          </div>

          <div
            id="start-search-results"
            class="search-results"
          ></div>

          <div class="swap-row">
            <button
              id="swap-btn"
              class="swap-btn"
              type="button"
              title="출발지와 도착지 바꾸기"
            >
              ⇅
            </button>
          </div>

          <div class="search-row">
            <span class="search-icon">🔴</span>

            <input
              id="end-search"
              class="place-search"
              type="text"
              placeholder="도착지를 검색하세요"
            />

            <button
              id="end-search-btn"
              class="search-btn"
              type="button"
            >
              🔍
            </button>
          </div>

          <div
            id="end-search-results"
            class="search-results"
          ></div>

        </div>
        <div class="point-grid">
          <div class="point-box"><span class="dot start-dot"></span><div><small>출발</small><strong id="start-text">미선택</strong></div></div>
          <div class="point-box"><span class="dot end-dot"></span><div><small>도착</small><strong id="end-text">미선택</strong></div></div>
        </div>
        <button id="route-btn" class="primary-btn" disabled>내게 맞는 길 찾기</button>
        <button id="reset-btn" class="ghost-btn">초기화</button>
      </section>

      <section class="card">
        <div class="section-title"><span class="step-number">2</span><strong>나의 이동방식</strong></div>
        <div class="mode-list">

          <label class="mode-chip">
            <input
              type="radio"
              name="mobility-mode"
              value="walker"
              checked
            />
            <span>🚶 보행자</span>
          </label>

          <label class="mode-chip">
            <input
              type="radio"
              name="mobility-mode"
              value="stroller"
            />
            <span>👶 유모차</span>
          </label>

          <label class="mode-chip">
            <input
              type="radio"
              name="mobility-mode"
              value="manual_wc"
            />
            <span>♿ 수동휠체어</span>
          </label>

          <label class="mode-chip">
            <input
              type="radio"
              name="mobility-mode"
              value="assist"
            />
            <span>⚡ Power Assist</span>
          </label>

        </div>
      </section>

      <section class="card results-card">
        <div class="section-title"><span class="step-number">3</span><strong>추천 경로</strong></div>
        <div id="status" class="status">아직 계산된 경로가 없습니다.</div>
        <div id="results"></div>
      </section>

      <footer><p>※ 현재 V0.1은 경사 중심 prototype입니다. 실제 휠체어 접근 가능성을 보장하지 않습니다.</p></footer>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>
      <button
        id="current-location-btn"
        class="map-control-btn location-btn"
        type="button"
        title="현재 위치"
      >
        ◎
      </button>
      <div class="map-hint">지도 클릭 → 출발 → 도착</div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="./static/config.js?v=3"></script>
  <script src="./static/app.js?v=10"></script>
</html>
